<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具导航</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent2: #22c55e;
      --sidebar-w: 260px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    /* ---- 侧边栏 ---- */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 20;
      transition: transform .2s ease;
    }

    .sidebar-header {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }

    .sidebar-header .sub {
      color: var(--muted);
      font-size: 0.78rem;
      margin: 0;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-section {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .12s, border-color .12s;
      text-decoration: none;
      color: inherit;
      background: transparent;
      width: 100%;
      text-align: left;
      font: inherit;
    }

    .nav-item:hover {
      background: #1e2d44;
    }

    .nav-item.active {
      background: #1e2d44;
      border-color: #3d5270;
    }

    .nav-item .icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      background: #1e2d44;
      border: 1px solid #2a4570;
      flex-shrink: 0;
    }

    .nav-item.active .icon {
      background: #1e3a5f;
      border-color: #3b82f6;
    }

    .nav-item .meta {
      flex: 1;
      min-width: 0;
    }

    .nav-item .title {
      font-size: 0.88rem;
      font-weight: 600;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item .desc {
      font-size: 0.72rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }

    /* ---- 主内容区 ---- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .topbar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .menu-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #243044;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .topbar-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .frame-wrap {
      flex: 1;
      position: relative;
      background: var(--bg);
      min-height: 0;
    }

    .frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
    }

    /* 首页：可滚动，适配手机端向下滑动 */
    .welcome {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
      text-align: center;
      background:
        radial-gradient(900px 500px at 20% -10%, #1e3a5f 0%, transparent 50%),
        radial-gradient(700px 400px at 90% 10%, #1a3a2a 0%, transparent 45%),
        var(--bg);
    }

    .welcome.hidden {
      display: none;
    }

    .welcome-inner {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .welcome h2 {
      font-size: 1.4rem;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .welcome-inner > p.lead {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0 auto 20px;
      max-width: 420px;
    }

    .welcome-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .welcome-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      width: 200px;
      max-width: calc(50% - 6px);
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, transform .12s;
    }

    .welcome-card:hover {
      border-color: #3d5270;
      transform: translateY(-2px);
    }

    .welcome-card .wc-icon {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .welcome-card .wc-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0 0 4px;
    }

    .welcome-card .wc-desc {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }

    /* 资源区：TVBox / Mihomo 脚本链接 */
    .resource-section {
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 16px 14px;
      margin-bottom: 14px;
    }

    .resource-section h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .resource-section .rs-desc {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0 0 12px;
      line-height: 1.45;
    }

    .link-preview {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      background: #121c2a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      word-break: break-all;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .resource-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .copy-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #243044;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, border-color .12s;
    }

    .copy-btn:hover {
      background: #2c3a52;
      border-color: #3d5270;
    }

    .copy-btn.copied {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.45);
      color: #86efac;
    }

    .copy-btn.primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-color: transparent;
      color: #fff;
    }

    .copy-btn.primary:hover {
      filter: brightness(1.08);
    }

    .copy-btn.success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-color: transparent;
      color: #fff;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--panel);
      border: 1px solid #3d5270;
      color: var(--text);
      font-size: 0.85rem;
      padding: 10px 18px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 15;
    }

    .overlay.show {
      display: block;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: 8px 0 30px rgba(0, 0, 0, 0.4);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .topbar {
        display: flex;
      }

      .welcome {
        padding: 20px 14px 40px;
        justify-content: flex-start;
      }

      .welcome h2 {
        font-size: 1.25rem;
      }

      .welcome-card {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>工具导航</h1>
        <p class="sub">本地小工具 · 点击切换</p>
      </div>

      <nav class="nav-list" id="navList">
        <div class="nav-section">可用工具</div>
      </nav>

      <div class="sidebar-footer">
        本地运行 · 不会上传任何数据
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="打开菜单">☰</button>
        <h2 class="topbar-title" id="topbarTitle">工具导航</h2>
      </div>

      <div class="frame-wrap">
        <div class="welcome" id="welcome">
          <div class="welcome-inner">
            <h2>选择一个工具开始</h2>
            <p class="lead">从左侧（或下方）选择工具，页面会在本窗口内加载。手机端可上下滑动查看全部内容。</p>
            <div class="welcome-cards" id="welcomeCards"></div>

            <!-- TVBox 接口：复制 dc 文件链接 -->
            <div class="resource-section">
              <h3>📺 TVBox 接口</h3>
              <p class="rs-desc">
                复制本地 <code>dc</code> 接口文件链接，粘贴到 TVBox「订阅 / 仓库」中使用。
                （需通过 HTTP 访问本站时链接才可用，file:// 打开时仅能复制相对路径。）
              </p>
              <div class="link-preview" id="dcLinkPreview">dc</div>
              <div class="resource-actions">
                <button type="button" class="copy-btn primary" id="copyDcLink">📋 复制接口文件链接 (dc)</button>
              </div>
            </div>

            <!-- Mihomo 覆写脚本：复制 mihomoScript.js 链接 -->
            <div class="resource-section">
              <h3>📝 Mihomo 覆写脚本</h3>
              <p class="rs-desc">
                复制 <code>mihomoScript.js</code> 脚本文件链接，可填入 Mihomo / Clash Meta 的「覆写脚本 URL」配置项。
              </p>
              <div class="link-preview" id="scriptLinkPreview">mihomoScript.js</div>
              <div class="resource-actions">
                <button type="button" class="copy-btn success" id="copyMihomoScriptLink">📋 复制脚本文件链接 (mihomoScript.js)</button>
              </div>
            </div>
          </div>
        </div>
        <iframe id="toolFrame" title="工具页面" style="display:none"></iframe>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /**
     * 在此添加 / 修改工具即可。
     * id: 唯一标识
     * title / desc: 侧边栏与欢迎页展示
     * icon: emoji
     * src: 相对路径的工具 HTML
     */
    const tools = [
      {
        id: "mihomo",
        title: "协议链接 → Mihomo",
        desc: "VLESS / SS / Trojan + WS + TLS，支持 ECH",
        icon: "⚡",
        src: "mihomo-converter.html",
      },
      {
        id: "mihomo-claude",
        title: "Mihomo 转换（Claude 版）",
        desc: "另一套实现，可生成完整配置含 DNS / 规则",
        icon: "✦",
        src: "mihomo-converterByClaude.html",
      },
      {
        id: "vless-fission",
        title: "vless节点裂变生成器",
        desc: "根据优选域名/ip进行裂变生产多个节点",
        icon: "🔀",
        src: "vless-fission-generator.html",
      },
      {
        id: "gh",
        title: "Github release加速下载",
        desc: "加速下载最新的 release 资源",
        icon: "📦",
        src: "gh.html",
      },
    ];

    const navList = document.getElementById("navList");
    const welcome = document.getElementById("welcome");
    const welcomeCards = document.getElementById("welcomeCards");
    const frame = document.getElementById("toolFrame");
    const topbarTitle = document.getElementById("topbarTitle");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuBtn = document.getElementById("menuBtn");
    const toastEl = document.getElementById("toast");
    const dcLinkPreview = document.getElementById("dcLinkPreview");
    const scriptLinkPreview = document.getElementById("scriptLinkPreview");

    let currentId = null;

    /** 生成相对文件的可访问绝对链接（HTTP 环境下为完整 URL，file 协议下退回相对路径） */
    function fileUrl(relativePath) {
      try {
        const u = new URL(relativePath, window.location.href);
        if (u.protocol === "http:" || u.protocol === "https:") {
          return u.href;
        }
      } catch (_) {}
      return relativePath;
    }

    const DC_LINK = fileUrl("dc");
    const SCRIPT_LINK = fileUrl("mihomoScript.js");

    dcLinkPreview.textContent = DC_LINK;
    scriptLinkPreview.textContent = SCRIPT_LINK;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      if (btn) {
        const old = btn.textContent;
        btn.classList.add("copied");
        btn.textContent = "✅ 已复制";
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.textContent = old;
        }, 1400);
      }
      showToast("已复制到剪贴板");
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderNav() {
      const section = navList.querySelector(".nav-section");
      navList.innerHTML = "";
      if (section) navList.appendChild(section);
      else {
        const s = document.createElement("div");
        s.className = "nav-section";
        s.textContent = "可用工具";
        navList.appendChild(s);
      }

      tools.forEach((t) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "nav-item" + (currentId === t.id ? " active" : "");
        btn.dataset.id = t.id;
        btn.innerHTML = `
          <span class="icon">${t.icon}</span>
          <span class="meta">
            <span class="title">${escapeHtml(t.title)}</span>
            <span class="desc">${escapeHtml(t.desc)}</span>
          </span>
        `;
        btn.addEventListener("click", () => openTool(t.id));
        navList.appendChild(btn);
      });
    }

    function renderWelcomeCards() {
      welcomeCards.innerHTML = "";
      tools.forEach((t) => {
        const card = document.createElement("div");
        card.className = "welcome-card";
        card.innerHTML = `
          <div class="wc-icon">${t.icon}</div>
          <div class="wc-title">${escapeHtml(t.title)}</div>
          <div class="wc-desc">${escapeHtml(t.desc)}</div>
        `;
        card.addEventListener("click", () => openTool(t.id));
        welcomeCards.appendChild(card);
      });
    }

    function openTool(id) {
      const tool = tools.find((t) => t.id === id);
      if (!tool) return;

      currentId = id;
      frame.src = tool.src;
      frame.style.display = "block";
      welcome.classList.add("hidden");
      topbarTitle.textContent = tool.title;

      navList.querySelectorAll(".nav-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.id === id);
      });

      closeSidebar();

      if (location.hash.slice(1) !== id) {
        history.replaceState(null, "", "#" + id);
      }
    }

    function openSidebar() {
      sidebar.classList.add("open");
      overlay.classList.add("show");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    }

    menuBtn.addEventListener("click", () => {
      if (sidebar.classList.contains("open")) closeSidebar();
      else openSidebar();
    });
    overlay.addEventListener("click", closeSidebar);

    document.getElementById("copyDcLink").addEventListener("click", function () {
      copyText(DC_LINK, this);
    });

    document.getElementById("copyMihomoScriptLink").addEventListener("click", function () {
      copyText(SCRIPT_LINK, this);
    });

    // 初始化
    renderNav();
    renderWelcomeCards();

    const hashId = location.hash.slice(1);
    if (hashId && tools.some((t) => t.id === hashId)) {
      openTool(hashId);
    }

    window.addEventListener("hashchange", () => {
      const id = location.hash.slice(1);
      if (id && tools.some((t) => t.id === id)) openTool(id);
      else {
        currentId = null;
        frame.style.display = "none";
        frame.src = "about:blank";
        welcome.classList.remove("hidden");
        topbarTitle.textContent = "工具导航";
        navList.querySelectorAll(".nav-item").forEach((el) => el.classList.remove("active"));
      }
    });
  </script>
</body>

</html>
